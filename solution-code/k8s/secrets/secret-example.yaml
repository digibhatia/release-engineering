# TEMPLATE ONLY — never commit real values here. In practice this
# resource is created by a secrets manager integration (e.g. External
# Secrets Operator pulling from AWS Secrets Manager / Vault), not
# applied by hand from a file that sits in the repo. Shown here so the
# shape of what src/release/promotion.py's resolve_secret() expects to
# find as environment variables is documented alongside the code that
# reads it.
#
# Rotation policy (enforced operationally, not by Kubernetes itself):
# each key listed below is rotated every <= 90 days — see
# src/release/promotion.py's is_rotation_overdue(). A rotation replaces
# this Secret's data and triggers a rolling restart of the Deployment/
# Rollout so pods pick up the new value; the OLD key stays valid for a
# short overlap window at the provider so in-flight requests don't fail
# mid-rotation.
apiVersion: v1
kind: Secret
metadata:
  name: sakh-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME_NEVER_COMMIT"
  LLOYDS_RETAIL_OPENAI_KEY: "REPLACE_ME_NEVER_COMMIT"
  LLOYDS_BIZ_OPENAI_KEY: "REPLACE_ME_NEVER_COMMIT"
